<!doctype html><html lang="cs"><head><meta name="robots" content="noindex,follow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Objednávky | Kup si apku</title><link rel="stylesheet" href="style.css?v=20260926-2"><script src="header.js?v=20260926-2" defer></script></head><body><header class="siteHeader"><div class="siteHeader-inner"><a class="siteHeader-brand" href="/"><span aria-hidden="true">🚀</span> KUP SI <b>APKU</b></a><div class="siteHeader-languages" aria-label="Jazyk"><span aria-current="true"><span class="siteHeader-flag siteHeader-flagCZ" aria-hidden="true"></span>CZ</span><a href="/en/objednavky.html" lang="en" hreflang="en" aria-label="English version"><span class="siteHeader-flag siteHeader-flagGB" aria-hidden="true"></span>EN</a></div><button class="siteHeader-toggle" type="button" aria-expanded="false" aria-controls="site-navigation" aria-label="Otevřít menu" hidden><span aria-hidden="true">☰</span></button><nav class="siteHeader-nav" id="site-navigation" aria-label="Hlavní navigace"><a href="/index.html#apps">Aplikace</a><a href="/doporucit.html">Doporučit a vydělat</a><a href="/ucet.html">Můj účet</a></nav></div></header><main class="accountMain"><section class="accountShell"><div class="eyebrow">Objednávky</div><h1>Moje objednávky</h1><div class="accountPanel" id="orders"><div class="accountRow"><b>Načítám objednávky…</b></div></div><div class="accountActions"><a class="btn" href="ucet.html">Zpět do účtu</a></div></section></main><script>
(async()=>{const box=document.getElementById('orders');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=(n,c)=>(Number(n||0)/100).toLocaleString('cs-CZ',{style:'currency',currency:c||'CZK'});const status={pending:'Přijata',awaiting_payment:'Čeká na platbu',paid:'Zaplacena',cancelled:'Zrušena',refunded:'Vrácena'};try{const r=await fetch('/api/orders/list.php',{credentials:'same-origin',headers:{Accept:'application/json'}});const d=await r.json().catch(()=>({}));if(r.status===401){location.href='/prihlaseni.html?next='+encodeURIComponent('/objednavky.html');return}if(!r.ok||!d.ok)throw new Error(d.message||'Objednávky se nepodařilo načíst.');if(!d.orders.length){box.innerHTML='<div class="accountRow"><b>Zatím bez objednávek</b><span class="statusPill">Připraveno</span></div>';return}box.innerHTML='<div class="accountRow"><b>Objednávka</b><span>Datum</span><span>Částka</span><span>Stav</span></div>'+d.orders.map(o=>'<div class="accountRow"><b>'+esc(o.number)+'</b><span>'+esc(new Date(String(o.createdAt).replace(' ','T')+'Z').toLocaleDateString('cs-CZ'))+'</span><span>'+esc(money(o.totalMinor,o.currency))+'</span><span class="statusPill">'+esc(status[o.status]||o.status)+'</span></div>').join('');}catch(e){box.innerHTML='<div class="accountRow"><b>Objednávky se nepodařilo načíst.</b><span>'+esc(e.message)+'</span></div>';}})();
</script></body></html>
