<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registrace | Kup si apku</title><link rel="stylesheet" href="style.css?v=20260926-2"><script src="header.js?v=20260926-2" defer></script></head><body><header class="siteHeader"><div class="siteHeader-inner"><a class="siteHeader-brand" href="/"><span aria-hidden="true">🚀</span> KUP SI <b>APKU</b></a><div class="siteHeader-languages" aria-label="Jazyk"><span aria-current="true"><span class="siteHeader-flag siteHeader-flagCZ" aria-hidden="true"></span>CZ</span><a href="/en/registrace.html" lang="en" hreflang="en" aria-label="English version"><span class="siteHeader-flag siteHeader-flagGB" aria-hidden="true"></span>EN</a></div><button class="siteHeader-toggle" type="button" aria-expanded="false" aria-controls="site-navigation" aria-label="Otevřít menu" hidden><span aria-hidden="true">☰</span></button><nav class="siteHeader-nav" id="site-navigation" aria-label="Hlavní navigace"><a href="/index.html#apps">Aplikace</a><a href="/doporucit.html">Doporučit a vydělat</a><a href="/ucet.html">Můj účet</a></nav></div></header><main class="accountMain"><section class="accountShell"><div class="eyebrow">Registrace</div><h1>Vytvořit účet</h1><form id="registerForm" novalidate><div class="accountPanel"><label class="accountRow"><span>Jméno</span><input id="firstName" name="firstName" autocomplete="given-name" maxlength="100" required><small class="fieldError" id="firstNameError"></small></label><label class="accountRow"><span>Příjmení</span><input id="lastName" name="lastName" autocomplete="family-name" maxlength="100" required><small class="fieldError" id="lastNameError"></small></label><label class="accountRow"><span>E-mail</span><input id="email" name="email" type="email" autocomplete="email" maxlength="190" required><small class="fieldError" id="emailError"></small></label><label class="accountRow"><span>Telefon</span><input id="phone" name="phone" type="tel" autocomplete="tel" maxlength="40"><small class="fieldError" id="phoneError"></small></label><label class="accountRow"><span>Heslo</span><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required><small class="fieldError" id="passwordError"></small></label></div><div id="formMessage" role="alert" aria-live="polite"></div><div class="accountActions"><button id="submitButton" class="btn" type="submit">Vytvořit účet</button><a href="index.html">Zpět</a></div></form><p class="legal">Po registraci budete automaticky přihlášeni.</p></section></main><script>
(() => {
  const form = document.getElementById('registerForm');
  const button = document.getElementById('submitButton');
  const message = document.getElementById('formMessage');
  const fields = ['firstName','lastName','email','phone','password'];
  const clearErrors = () => { message.textContent=''; fields.forEach(n => { const e=document.getElementById(n+'Error'); if(e)e.textContent=''; document.getElementById(n)?.removeAttribute('aria-invalid'); }); };
  const showFieldErrors = errors => { Object.entries(errors || {}).forEach(([name,text]) => { const el=document.getElementById(name+'Error'); const input=document.getElementById(name); if(el)el.textContent=String(text); if(input)input.setAttribute('aria-invalid','true'); }); };
  form.addEventListener('submit', async e => {
    e.preventDefault(); clearErrors();
    if (!form.reportValidity()) return;
    button.disabled=true; button.textContent='Registruji…';
    try {
      const response = await fetch('/api/auth/register.php', {method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json','Accept':'application/json'}, body:JSON.stringify({firstName:document.getElementById('firstName').value.trim(),lastName:document.getElementById('lastName').value.trim(),email:document.getElementById('email').value.trim(),phone:document.getElementById('phone').value.trim(),password:document.getElementById('password').value})});
      const data = await response.json().catch(() => ({}));
      if (!response.ok || !data.ok) {
        if (data.fields) showFieldErrors(data.fields);
        if (data.error === 'EMAIL_EXISTS') document.getElementById('emailError').textContent=data.message || 'Účet s tímto e-mailem již existuje.';
        message.textContent = data.message || (response.status === 429 ? 'Příliš mnoho pokusů. Zkuste to později.' : 'Registraci se nepodařilo dokončit.');
        return;
      }
      if (data.csrfToken) sessionStorage.setItem('ksa_csrf', data.csrfToken);
      window.location.assign('/ucet.html');
    } catch (_) { message.textContent='Server je momentálně nedostupný. Zkuste to prosím znovu.'; }
    finally { button.disabled=false; button.textContent='Vytvořit účet'; }
  });
})();
</script></body></html>
