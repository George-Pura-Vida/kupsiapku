<!doctype html><html lang="cs"><head><meta name="robots" content="noindex,follow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moje aplikace | Kup si apku</title><link rel="stylesheet" href="style.css?v=20260929-apps"><script src="header.js?v=20260926-2" defer></script></head><body><header class="siteHeader"><div class="siteHeader-inner"><a class="siteHeader-brand" href="/"><span aria-hidden="true">🚀</span> KUP SI <b>APKU</b></a><div class="siteHeader-languages" aria-label="Jazyk"><span aria-current="true"><span class="siteHeader-flag siteHeader-flagCZ" aria-hidden="true"></span>CZ</span><a href="/en/moje-aplikace.html" lang="en" hreflang="en" aria-label="English version"><span class="siteHeader-flag siteHeader-flagGB" aria-hidden="true"></span>EN</a></div><button class="siteHeader-toggle" type="button" aria-expanded="false" aria-controls="site-navigation" aria-label="Otevřít menu" hidden><span aria-hidden="true">☰</span></button><nav class="siteHeader-nav" id="site-navigation" aria-label="Hlavní navigace"><a href="/index.html#apps">Aplikace</a><a href="/doporucit.html">Doporučit a vydělat</a><a href="/ucet.html">Můj účet</a></nav></div></header><main class="accountMain"><section class="accountShell"><div class="eyebrow">Moje aplikace</div><h1>Zakoupené aplikace</h1><p id="welcome">Načítám vaše aktivní aplikace…</p><div class="accountPanel" id="apps"><div class="accountRow"><b>Načítám…</b></div></div><div class="accountActions"><a class="btn" href="ucet.html">Zpět do účtu</a><a class="btn" href="index.html#apps">Další aplikace</a></div></section></main><script>
(async()=>{const box=document.getElementById('apps'),welcome=document.getElementById('welcome');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));try{const r=await fetch('/api/apps/list.php',{credentials:'same-origin',headers:{Accept:'application/json'}});const d=await r.json().catch(()=>({}));if(r.status===401){location.href='/prihlaseni.html?next='+encodeURIComponent('/moje-aplikace.html');return}if(!r.ok||!d.ok)throw new Error(d.message||'Aplikace se nepodařilo načíst.');const name=[d.user?.firstName,d.user?.lastName].filter(Boolean).join(' ');welcome.textContent=name?'Přihlášen: '+name:'Přihlášen: '+(d.user?.email||'uživatel');if(!d.apps.length){box.innerHTML='<div class="accountRow"><b>🔒 Zatím nemáte žádnou aktivní aplikaci</b><span>Po zaplacení objednávky se zakoupená aplikace zobrazí automaticky.</span></div>';return}box.innerHTML=d.apps.map(a=>'<div class="accountRow"><b>'+esc(a.icon)+' '+esc(a.name)+'</b><span class="statusPill">Aktivní</span>'+(a.url?'<a class="btn" href="'+esc(a.url)+'">Otevřít</a>':'<span>Připravujeme</span>')+'</div>').join('');}catch(e){welcome.textContent='';box.innerHTML='<div class="accountRow"><b>Aplikace se nepodařilo načíst.</b><span>'+esc(e.message)+'</span></div>';}})();
</script></body></html>
