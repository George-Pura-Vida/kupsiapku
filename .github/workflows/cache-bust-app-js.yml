name: Cache-bust app.js once

on:
  push:
    paths:
      - '.github/workflows/cache-bust-app-js.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update app.js version
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'app.js?v=20260922-2230'
          new = 'app.js?v=20260928-3'
          if old not in s:
              raise SystemExit(f'Expected {old} not found; refusing to change index.html')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Cache-bust app.js on production"
          git push
