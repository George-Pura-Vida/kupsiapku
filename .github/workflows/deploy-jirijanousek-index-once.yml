name: Locate production statistics markup

on:
  push:
    branches:
      - ops/deploy-jirijanousek-index-218b237
    paths:
      - .github/workflows/deploy-jirijanousek-index-once.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Locate stats in current production index.php
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          curl --insecure --fail --silent --show-error --max-time 30 \
            --ftp-ssl-reqd \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            "ftp://$FTP_SERVER:21/jirijanousek/index.php" \
            -o /tmp/prod.php

          echo '--- MATCHES ---'
          grep -niE 'stats|stat-|klient|sprav|100\+|mil\.|člen|clen|tým|tym|zkušen|zkusen|trust|metric|counter' /tmp/prod.php | head -n 160 || true

          echo '--- PHP INCLUDES/REQUIRES ---'
          grep -niE 'include|require' /tmp/prod.php | head -n 80 || true

          echo '--- LINES 130-260 ---'
          nl -ba /tmp/prod.php | sed -n '130,260p'
          echo 'READ-ONLY INSPECTION COMPLETE; NO FILES UPLOADED.'
