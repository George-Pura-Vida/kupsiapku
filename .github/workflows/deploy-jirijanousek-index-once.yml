name: Inspect production index initialization

on:
  push:
    branches:
      - ops/deploy-jirijanousek-index-218b237
    paths:
      - .github/workflows/deploy-jirijanousek-index-once.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Read current production index.php initialization
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          curl --insecure --fail --silent --show-error --max-time 30 \
            --ftp-ssl-reqd \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            "ftp://$FTP_SERVER:21/jirijanousek/index.php" \
            -o /tmp/prod.php
          echo '--- LINES 1-45 ---'
          nl -ba /tmp/prod.php | sed -n '1,45p'
          echo '--- LINES 375-400 ---'
          nl -ba /tmp/prod.php | sed -n '375,400p'
          echo 'READ-ONLY INSPECTION COMPLETE; NO FILES UPLOADED.'
