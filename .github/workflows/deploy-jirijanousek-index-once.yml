name: Fingerprint jirijanousek.cz source

on:
  push:
    branches:
      - ops/deploy-jirijanousek-index-218b237
    paths:
      - .github/workflows/deploy-jirijanousek-index-once.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate staged source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object ops/jirijanousek/index.php)" = "fd25251ff68db34cc151599546fd96dd784d7f53"

      - name: Read-only source fingerprint
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          curl --insecure --fail --silent --show-error --max-time 30 \
            --ftp-ssl-reqd \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            "ftp://$FTP_SERVER:21/jirijanousek/index.php" \
            -o /tmp/prod-source.php

          echo '--- PROD SOURCE FINGERPRINT ---'
          wc -c /tmp/prod-source.php
          sha256sum /tmp/prod-source.php
          grep -Eo '<title>[^<]+' /tmp/prod-source.php | head -n 1 || true
          for marker in \
            'Diverzifikace a stabilita' \
            'Digitální aktivum budoucnosti' \
            'SPRÁVA WEBU' \
            '100+ mil' \
            '100+ MIL' \
            '6 členů' \
            '6 ČLENŮ' \
            'spokojených klientů' \
            'TÝM'; do
            if grep -Fi "$marker" /tmp/prod-source.php >/dev/null; then echo "FOUND: $marker"; fi
          done

          echo '--- RELEVANT LINES ---'
          grep -niE 'spokojen|100\+|6 člen|6 ČLEN|Diverzifikace|budoucnosti|SPRÁVA WEBU|TÝM' /tmp/prod-source.php | head -n 40 || true
          echo 'READ-ONLY FINGERPRINT COMPLETE; NO FILES UPLOADED.'
