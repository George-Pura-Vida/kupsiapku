name: Diagnose jirijanousek.cz production router

on:
  push:
    branches:
      - ops/deploy-jirijanousek-index-218b237
    paths:
      - .github/workflows/deploy-jirijanousek-index-once.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate staged source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object ops/jirijanousek/index.php)" = "fd25251ff68db34cc151599546fd96dd784d7f53"

      - name: Read-only production diagnostics
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FTP_SERVER"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"

          curl --insecure --fail --silent --show-error --max-time 30 \
            --ftp-ssl-reqd \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            "ftp://$FTP_SERVER:21/public_html/" -o /tmp/public-html-listing.txt
          echo '--- PUBLIC_HTML LISTING ---'
          sed -n '1,120p' /tmp/public-html-listing.txt

          curl --insecure --fail --silent --show-error --max-time 30 \
            --ftp-ssl-reqd \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            "ftp://$FTP_SERVER:21/public_html/index.php" -o /tmp/public_html_index.php
          echo '--- PUBLIC_HTML/INDEX.PHP ---'
          cat /tmp/public_html_index.php

          echo 'READ-ONLY DIAGNOSTIC COMPLETE; NO FILES UPLOADED.'
