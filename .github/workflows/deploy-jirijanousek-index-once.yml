name: Diagnose jirijanousek.cz FTP root

on:
  push:
    branches:
      - ops/deploy-jirijanousek-index-218b237
    paths:
      - .github/workflows/deploy-jirijanousek-index-once.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate staged source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object ops/jirijanousek/index.php)" = "fd25251ff68db34cc151599546fd96dd784d7f53"

      - name: Read-only FTP diagnostics
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FTP_SERVER"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"

          curl --fail --silent --show-error --max-time 30 \
            --ftp-ssl-reqd \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            "ftp://$FTP_SERVER:21/" -o /tmp/root-listing.txt
          echo '--- FTP ROOT LISTING ---'
          sed -n '1,80p' /tmp/root-listing.txt

          for path in index.php index.html public_html/index.php public_html/index.html; do
            safe_name="$(echo "$path" | tr '/' '-')"
            if curl --fail --silent --show-error --max-time 30 \
              --ftp-ssl-reqd \
              --user "$FTP_USERNAME:$FTP_PASSWORD" \
              "ftp://$FTP_SERVER:21/$path" -o "/tmp/$safe_name"; then
              echo "--- $path ---"
              wc -c "/tmp/$safe_name"
              grep -Eo '<title>[^<]+' "/tmp/$safe_name" | head -n 1 || true
              for marker in '1 000+' '100+ MIL.' '6 ČLENŮ V TÝMU' 'KLIENTŮ V RÁMCI DLOUHODOBÉ PROFESNÍ PRAXE' 'KupSiApku' 'kupsiapku'; do
                if grep -F "$marker" "/tmp/$safe_name" >/dev/null; then echo "FOUND: $marker"; fi
              done
            else
              echo "MISSING: $path"
            fi
          done

          echo 'READ-ONLY DIAGNOSTIC COMPLETE; NO FILES UPLOADED.'
