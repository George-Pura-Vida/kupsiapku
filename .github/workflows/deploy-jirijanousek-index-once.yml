name: Locate jirijanousek.cz static build

on:
  push:
    branches:
      - ops/deploy-jirijanousek-index-218b237
    paths:
      - .github/workflows/deploy-jirijanousek-index-once.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate staged source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object ops/jirijanousek/index.php)" = "fd25251ff68db34cc151599546fd96dd784d7f53"

      - name: Read-only locate likely static builds
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          for dir in jirijanousek preview public_html/preview; do
            echo "--- LISTING $dir/ ---"
            if curl --insecure --fail --silent --show-error --max-time 30 \
              --ftp-ssl-reqd \
              --user "$FTP_USERNAME:$FTP_PASSWORD" \
              "ftp://$FTP_SERVER:21/$dir/" -o /tmp/listing.txt; then
              sed -n '1,120p' /tmp/listing.txt
            else
              echo "MISSING DIR: $dir"
            fi

            for file in index.php index.html README.md .git/HEAD; do
              safe="$(echo "$dir-$file" | tr '/.' '--')"
              if curl --insecure --fail --silent --show-error --max-time 30 \
                --ftp-ssl-reqd \
                --user "$FTP_USERNAME:$FTP_PASSWORD" \
                "ftp://$FTP_SERVER:21/$dir/$file" -o "/tmp/$safe"; then
                echo "FILE: $dir/$file"
                wc -c "/tmp/$safe"
                grep -Eo '<title>[^<]+' "/tmp/$safe" | head -n 1 || true
                for marker in '1 000+' '100+ MIL.' '6 ČLENŮ V TÝMU' '200 MIL. KČ' 'KLIENTŮ V RÁMCI DLOUHODOBÉ PROFESNÍ PRAXE' 'OBJEM KLIENTSKÝCH INVESTIC V DLOUHODOBÉ PÉČI' 'ref: refs/heads/'; do
                  if grep -F "$marker" "/tmp/$safe" >/dev/null; then echo "FOUND: $marker"; fi
                done
              fi
            done
          done
          echo 'READ-ONLY LOCATE COMPLETE; NO FILES UPLOADED.'
