name: Deploy kupsiapku.cz
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: kupsiapku-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Validate shared frontend
        shell: bash
        run: |
          node --check cart.js
          node --check header.js
          node --check app.js
          python3 - <<'PY'
          from pathlib import Path
          errors=[]
          pages=[
            'moje-finance.html','en/my-finances.html',
            'moje-zdravi.html','en/my-health.html',
            'moje-portfolio.html','en/my-portfolio.html',
          ]
          for name in pages:
              t=Path(name).read_text(encoding='utf-8')
              if 'siteHeader' not in t:
                  errors.append(f'{name}: missing siteHeader')
          for name in ('moje-portfolio.html','en/my-portfolio.html'):
              t=Path(name).read_text(encoding='utf-8')
              if 'data-cart-add="portfolio"' not in t:
                  errors.append(f'{name}: missing portfolio cart action')
          cart=Path('cart.js').read_text(encoding='utf-8')
          header=Path('header.js').read_text(encoding='utf-8')
          for required in ("[data-cart-add]","[data-cart-buy]","localStorage","data-cart-count","500 Kč","CZK 500"):
              if required not in cart+header:
                  errors.append(f'shared frontend: missing {required}')
          required_sections = {
              'moje-zdravi.html': ['Co Moje zdraví umí','BMR, AMR a kalorická bilance','Import a export'],
              'en/my-health.html': ['What My Health can do','BMR, AMR & calorie balance','Import & export'],
              'moje-finance.html': ['Co Moje finance umí','Finanční zrcadlo','Celý váš finanční obraz'],
              'en/my-finances.html': ['What My Finances can do','Financial snapshot','complete financial picture'],
              'moje-portfolio.html': ['Vaše investice. Jedno portfolio. Jasný přehled.','Statistiky','Grafy a alokace'],
              'en/my-portfolio.html': ['Your investments. One portfolio. A clear overview.','Statistics','Charts & allocation'],
          }
          for name, needles in required_sections.items():
              t=Path(name).read_text(encoding='utf-8')
              for needle in needles:
                  if needle not in t:
                      errors.append(f'{name}: missing restored detail section: {needle}')
          faq_pages = ['moje-zdravi.html','en/my-health.html','moje-finance.html','en/my-finances.html','moje-portfolio.html','en/my-portfolio.html']
          for name in faq_pages:
              t=Path(name).read_text(encoding='utf-8')
              if 'id="faq"' not in t:
                  errors.append(f'{name}: missing standardized FAQ')
          if errors:
              raise SystemExit('\n'.join(errors))
          standard_pages = ['moje-zdravi.html','en/my-health.html','moje-finance.html','en/my-finances.html','moje-portfolio.html','en/my-portfolio.html']
          for name in standard_pages:
              t=Path(name).read_text(encoding='utf-8')
              for required in ('productPage','productHero','productHero-media','purchaseRow','finalPurchase','data-cart-add','data-cart-checkout','id="faq"','/header.css','/header.js','/cart.js'):
                  if required not in t:
                      errors.append(f'{name}: shared product standard missing {required}')
              hero=t[t.find('<section class="hero'):t.find('</section>',t.find('<section class="hero'))]
              if hero.find('productHero-media') > hero.find('purchaseRow'):
                  errors.append(f'{name}: purchase must follow preview')
          print('Shared frontend validation OK')
          PY
          git diff --check

      - name: Apply SEO metadata to localized pages
        run: python3 tools/apply-seo-head.py

      - name: Set up PHP for admin security tests
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring

      - name: Validate admin authentication
        run: |
          php -l api/admin.php
          php -l api/admin-auth.php
          php -l api/bootstrap.php
          node --check admin.js
          python3 tests/admin_auth_test.py

      - name: Validate deployment secrets
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          test -n "$FTP_SERVER"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          test -n "$FTP_SERVER_DIR"

      - name: Deploy to Webkitty
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/database/**
            **/.env*
            **/admin-config.php
            **/api/data/*.sqlite*
            **/api/data/admin-database.json
            **/tests/**
            **/docs/**
            **/tools/**
            CNAME
            README.md

      - name: Verify production
        shell: bash
        run: |
          sleep 5
          for page in index.html en/index.html moje-finance.html en/my-finances.html moje-zdravi.html en/my-health.html moje-portfolio.html en/my-portfolio.html cart.js header.js header.css; do
            curl --fail --silent --show-error --max-time 30 "https://kupsiapku.cz/$page?deploy=${GITHUB_SHA}" -o "/tmp/$(echo "$page" | tr '/' '-')"
          done
          grep -F 'data-cart-add="portfolio"' /tmp/moje-portfolio.html >/dev/null
          grep -F 'data-cart-add="portfolio"' /tmp/en-my-portfolio.html >/dev/null
          grep -F '[data-cart-buy]' /tmp/cart.js >/dev/null
          grep -F 'siteHeader-cart' /tmp/header.js >/dev/null
          grep -F 'siteHeader-cart' /tmp/header.css >/dev/null
          node --check /tmp/cart.js
          node --check /tmp/header.js
          curl --fail --silent --show-error --max-time 30 "https://kupsiapku.cz/app.js?deploy=${GITHUB_SHA}" -o /tmp/app.js
          node --check /tmp/app.js
          grep -F 'kupsiapku_cart' /tmp/app.js >/dev/null
          grep -F 'portfolio' /tmp/app.js >/dev/null
          grep -F 'portfolio-prehled-sharp.svg' /tmp/moje-portfolio.html >/dev/null
          curl --fail --silent --show-error --max-time 30 "https://kupsiapku.cz/assets/screenshots/portfolio-prehled-sharp.svg?deploy=${GITHUB_SHA}" -o /tmp/portfolio-prehled-sharp.svg
          grep -F '<svg' /tmp/portfolio-prehled-sharp.svg >/dev/null
          grep -F 'portfolio-trhy.jpg' /tmp/en-my-portfolio.html >/dev/null
          echo 'Production validation OK'
