name: Deploy kupsiapku.cz
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: kupsiapku-production
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Patch homepage and product purchase UI safely
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          # Homepage patches remain content-based and idempotent.
          home_patches=[
            ('index.html','href="aplikace-finance.html"','href="/moje-finance.html"'),
            ('en/index.html','href="aplikace-finance.html"','href="/en/my-finances.html"'),
            ('index.html','href="aplikace-zdravi.html"','href="/moje-zdravi.html"'),
            ('en/index.html','href="aplikace-zdravi.html"','href="/en/my-health.html"'),
            ('index.html','<h3>Moje investice</h3>','<h3>Moje portfolio</h3>'),
            ('index.html','href="aplikace-investice.html"','href="/moje-portfolio.html"'),
            ('index.html','onclick="add(\'investice\')"','onclick="add(\'portfolio\')"'),
            ('en/index.html','<h3>My Investments</h3>','<h3>My Portfolio</h3>'),
            ('en/index.html','href="aplikace-investice.html"','href="/en/my-portfolio.html"'),
          ]
          originals={}
          expected={}
          for f,_,_ in home_patches:
            p=Path(f); originals.setdefault(p,p.read_text(encoding='utf-8')); expected.setdefault(p,originals[p])
          for f,old,new in home_patches:
            p=Path(f); text=expected[p]
            if text.count(old)==1 and text.count(new)==0: text=text.replace(old,new,1)
            elif text.count(old)==0 and text.count(new)==1: pass
            else: raise SystemExit(f'{f}: unsafe homepage patch counts for {old!r}')
            expected[p]=text
          for p,text in expected.items(): p.write_text(text,encoding='utf-8')

          # Product detail pages: exact anchors only, no whole-file source replacement.
          pages={
            'moje-finance.html':{
              'lang':'<div class="langSwitch" data-purchase-ui="lang"><a href="/moje-finance.html" aria-current="page">🇨🇿 CZ</a><a href="/en/my-finances.html" lang="en">🇬🇧 EN</a></div>',
              'lang_anchor':'<main class="mf">',
              'price':'<div class="price" data-purchase-ui="price">500 Kč</div>',
              'action_old':'<div class="actions"><a class="btn primary" href="/index.html#checkout">Chci Moje finance →</a><a class="btn secondary" href="#funkce">Co aplikace umí ↓</a></div>',
              'action_new':'<div class="actions" data-purchase-ui="actions"><button class="btn primary" type="button" data-cart-add="finance">🛒 Přidat do košíku</button><button class="btn secondary" type="button" data-cart-buy="finance">⚡ Koupit nyní</button><a class="btn secondary" data-cart-checkout href="/index.html#checkout">🛒 Košík (<span data-cart-count>0</span>)</a><a class="btn secondary" href="#funkce">Co aplikace umí ↓</a></div>',
              'script':'<script src="/cart.js" defer></script>',
            },
            'en/my-finances.html':{
              'lang':'<div class="langSwitch" data-purchase-ui="lang"><a href="/moje-finance.html" lang="cs">🇨🇿 CZ</a><a href="/en/my-finances.html" aria-current="page">🇬🇧 EN</a></div>',
              'lang_anchor':'<main class="mf">',
              'price':'<div class="price" data-purchase-ui="price">CZK 500</div>',
              'action_old':'<div class="actions"><a class="btn primary" href="/en/index.html#checkout">I want My Finances →</a><a class="btn secondary" href="#features">What the app does ↓</a></div>',
              'action_new':'<div class="actions" data-purchase-ui="actions"><button class="btn primary" type="button" data-cart-add="finance">🛒 Add to cart</button><button class="btn secondary" type="button" data-cart-buy="finance">⚡ Buy now</button><a class="btn secondary" data-cart-checkout href="/en/index.html#checkout">🛒 Cart (<span data-cart-count>0</span>)</a><a class="btn secondary" href="#features">What the app does ↓</a></div>',
              'script':'<script src="/cart.js" defer></script>',
            },
            'moje-zdravi.html':{
              'lang':'<div class="langSwitch" data-purchase-ui="lang"><a href="/moje-zdravi.html" aria-current="page">🇨🇿 CZ</a><a href="/en/my-health.html" lang="en">🇬🇧 EN</a></div>',
              'lang_anchor':'<main class="mh">',
              'price':None,
              'action_old':'<div class="actions"><a class="btn primary" href="/index.html#checkout">Chci Moje zdraví →</a><a class="btn secondary" href="#funkce">Co aplikace umí ↓</a></div>',
              'action_new':'<div class="actions" data-purchase-ui="actions"><button class="btn primary" type="button" data-cart-add="zdravi">🛒 Přidat do košíku</button><button class="btn secondary" type="button" data-cart-buy="zdravi">⚡ Koupit nyní</button><a class="btn secondary" data-cart-checkout href="/index.html#checkout">🛒 Košík (<span data-cart-count>0</span>)</a><a class="btn secondary" href="#funkce">Co aplikace umí ↓</a></div>',
              'script':'<script src="/cart.js" defer></script>',
            },
            'en/my-health.html':{
              'lang':'<div class="langSwitch" data-purchase-ui="lang"><a href="/moje-zdravi.html" lang="cs">🇨🇿 CZ</a><a href="/en/my-health.html" aria-current="page">🇬🇧 EN</a></div>',
              'lang_anchor':'<main class="mh">',
              'price':None,
              'action_old':'<div class="actions"><a class="btn primary" href="/en/index.html#checkout">I want My Health →</a><a class="btn secondary" href="#features">What the app does ↓</a></div>',
              'action_new':'<div class="actions" data-purchase-ui="actions"><button class="btn primary" type="button" data-cart-add="zdravi">🛒 Add to cart</button><button class="btn secondary" type="button" data-cart-buy="zdravi">⚡ Buy now</button><a class="btn secondary" data-cart-checkout href="/en/index.html#checkout">🛒 Cart (<span data-cart-count>0</span>)</a><a class="btn secondary" href="#features">What the app does ↓</a></div>',
              'script':'<script src="/cart.js" defer></script>',
            },
          }
          for name,cfg in pages.items():
            p=Path(name); text=p.read_text(encoding='utf-8'); before=text
            # Language switch is inserted once immediately before main; existing plain header EN/CZ links are left harmlessly intact.
            if 'data-purchase-ui="lang"' not in text:
              if text.count(cfg['lang_anchor'])!=1: raise SystemExit(f'{name}: main anchor unsafe')
              text=text.replace(cfg['lang_anchor'],cfg['lang']+cfg['lang_anchor'],1)
            if cfg['price'] and 'data-purchase-ui="price"' not in text:
              marker='<div class="benefits">'
              if text.count(marker)!=1: raise SystemExit(f'{name}: price anchor unsafe')
              text=text.replace(marker,cfg['price']+marker,1)
            if 'data-purchase-ui="actions"' not in text:
              if text.count(cfg['action_old'])!=1: raise SystemExit(f'{name}: purchase actions anchor unsafe, count={text.count(cfg["action_old"])}')
              text=text.replace(cfg['action_old'],cfg['action_new'],1)
            if cfg['script'] not in text:
              if text.count('</body>')!=1: raise SystemExit(f'{name}: body end unsafe')
              text=text.replace('</body>',cfg['script']+'</body>',1)
            p.write_text(text,encoding='utf-8')
            print(f'{name}: purchase UI patched safely')
          PY
          git diff --check
      - name: Add Buy now behavior to shared cart safely
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cart.js'); text=p.read_text(encoding='utf-8')
          old="const checkoutButton=e.target.closest('[data-cart-checkout]');if(checkoutButton){e.preventDefault();go()}"
          new="const buyButton=e.target.closest('[data-cart-buy]');if(buyButton){e.preventDefault();if(add(buyButton.dataset.cartBuy))go();return}const checkoutButton=e.target.closest('[data-cart-checkout]');if(checkoutButton){e.preventDefault();go()}"
          if text.count(old)==1 and text.count(new)==0: text=text.replace(old,new,1)
          elif text.count(old)==0 and text.count(new)==1: pass
          else: raise SystemExit('cart.js Buy now patch unsafe')
          p.write_text(text,encoding='utf-8')
          PY
          node --check cart.js
      - name: Render shared headers
        shell: bash
        run: |
          python3 tools/render-header.py
          python3 tools/render-header.py --check
          git diff --check
      - name: Validate Finance Health Portfolio purchase UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          specs=[
            ('moje-finance.html','500 Kč','finance','/index.html#checkout','🇨🇿 CZ','🇬🇧 EN'),
            ('en/my-finances.html','CZK 500','finance','/en/index.html#checkout','🇨🇿 CZ','🇬🇧 EN'),
            ('moje-zdravi.html','500 Kč','zdravi','/index.html#checkout','🇨🇿 CZ','🇬🇧 EN'),
            ('en/my-health.html','CZK 500','zdravi','/en/index.html#checkout','🇨🇿 CZ','🇬🇧 EN'),
            ('moje-portfolio.html','500 Kč','portfolio','/index.html#checkout',None,None),
            ('en/my-portfolio.html','CZK 500','portfolio','/en/index.html#checkout',None,None),
          ]
          errors=[]
          for name,price,product,checkout,cz,en in specs:
            t=Path(name).read_text(encoding='utf-8')
            required=[price,f'data-cart-add="{product}"','data-cart-count',f'href="{checkout}"','src="/cart.js"']
            if product in ('finance','zdravi'): required += [f'data-cart-buy="{product}"','data-purchase-ui="lang"',cz,en]
            for s in required:
              if s not in t: errors.append(f'{name}: missing {s}')
          cart=Path('cart.js').read_text(encoding='utf-8')
          if "[data-cart-buy]" not in cart: errors.append('cart.js: missing Buy now handler')
          if errors: raise SystemExit('Purchase UI validation failed:\n'+'\n'.join(errors))
          print('Purchase UI validation OK: Finance + Health CZ/EN, Portfolio preserved')
          PY
          node --check cart.js
      - name: Check shared navigation
        run: |
          python3 tools/render-header.py --check
          node --check header.js
      - name: Apply SEO metadata to localized pages
        run: python3 tools/apply-seo-head.py
      - name: Set up PHP for admin security tests
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring
      - name: Validate admin authentication before deployment
        run: |
          php -l api/admin.php
          php -l api/admin-auth.php
          php -l api/bootstrap.php
          node --check admin.js
          python3 tests/admin_auth_test.py
      - name: Validate deployment secrets
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          test -n "$FTP_SERVER"; test -n "$FTP_USERNAME"; test -n "$FTP_PASSWORD"; test -n "$FTP_SERVER_DIR"
      - name: Deploy to Webkitty
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/database/**
            **/.env*
            **/admin-config.php
            **/api/data/*.sqlite*
            **/api/data/admin-database.json
            **/tests/**
            **/docs/**
            **/tools/**
            CNAME
            README.md
      - name: Verify production purchase UI
        shell: bash
        run: |
          sleep 5
          for spec in \
            'moje-finance.html|500 Kč|finance|/index.html#checkout' \
            'en/my-finances.html|CZK 500|finance|/en/index.html#checkout' \
            'moje-zdravi.html|500 Kč|zdravi|/index.html#checkout' \
            'en/my-health.html|CZK 500|zdravi|/en/index.html#checkout'; do
            IFS='|' read -r page price product checkout <<< "$spec"
            out="/tmp/$(echo "$page" | tr '/' '-')"
            curl --fail --silent --show-error --max-time 30 "https://kupsiapku.cz/${page}?deploy=${GITHUB_SHA}" -o "$out"
            grep -F "$price" "$out" >/dev/null
            grep -F "data-cart-add=\"$product\"" "$out" >/dev/null
            grep -F "data-cart-buy=\"$product\"" "$out" >/dev/null
            grep -F 'data-cart-count' "$out" >/dev/null
            grep -F "href=\"$checkout\"" "$out" >/dev/null
            grep -F '🇨🇿 CZ' "$out" >/dev/null
            grep -F '🇬🇧 EN' "$out" >/dev/null
          done
          curl --fail --silent --show-error --max-time 30 "https://kupsiapku.cz/cart.js?deploy=${GITHUB_SHA}" -o /tmp/cart.js
          grep -F '[data-cart-buy]' /tmp/cart.js >/dev/null
          node --check /tmp/cart.js
          echo 'Production purchase UI OK: Finance + Health CZ/EN'
