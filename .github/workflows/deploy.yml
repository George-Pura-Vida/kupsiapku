name: Deploy kupsiapku.cz
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: kupsiapku-production
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Patch Czech and English homepage product links safely
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          files={Path('index.html'):Path('index.html').read_text(encoding='utf-8'),Path('en/index.html'):Path('en/index.html').read_text(encoding='utf-8')}
          expected=dict(files)
          patches=[
            (Path('index.html'),'href="aplikace-finance.html"','href="/moje-finance.html"','CZ Finance href'),
            (Path('en/index.html'),'href="aplikace-finance.html"','href="/en/my-finances.html"','EN Finance href'),
            (Path('index.html'),'href="aplikace-zdravi.html"','href="/moje-zdravi.html"','CZ Health href'),
            (Path('en/index.html'),'href="aplikace-zdravi.html"','href="/en/my-health.html"','EN Health href'),
            (Path('index.html'),'<h3>Moje investice</h3>','<h3>Moje portfolio</h3>','CZ Portfolio name'),
            (Path('index.html'),'href="aplikace-investice.html"','href="/moje-portfolio.html"','CZ Portfolio href'),
            (Path('index.html'),'onclick="add(\'investice\')"','onclick="add(\'portfolio\')"','CZ Portfolio cart product'),
            (Path('en/index.html'),'<h3>My Investments</h3>','<h3>My Portfolio</h3>','EN Portfolio name'),
            (Path('en/index.html'),'href="aplikace-investice.html"','href="/en/my-portfolio.html"','EN Portfolio href'),
          ]
          for path,old,new,label in patches:
            before=expected[path]
            old_count=before.count(old); new_count=before.count(new)
            if old_count==1 and new_count==0:
              expected[path]=before.replace(old,new,1)
              print(f'{label}: patched exactly once')
            elif old_count==0 and new_count==1:
              print(f'{label}: already patched')
            else:
              raise SystemExit(f'{label}: unsafe counts old={old_count}, new={new_count}')

          cs0=files[Path('index.html')]; cs=expected[Path('index.html')]
          en0=files[Path('en/index.html')]; en=expected[Path('en/index.html')]
          if cs0.count('onclick="add(\'finance\')"') != cs.count('onclick="add(\'finance\')"'): raise SystemExit('CZ Finance cart changed unexpectedly')
          if cs0.count('onclick="add(\'zdravi\')"') != cs.count('onclick="add(\'zdravi\')"'): raise SystemExit('CZ Health cart changed unexpectedly')
          checks={
            'CZ Portfolio name':cs.count('<h3>Moje portfolio</h3>')==1,
            'CZ Portfolio href':cs.count('href="/moje-portfolio.html"')==1,
            'CZ Portfolio product':cs.count('onclick="add(\'portfolio\')"')==1,
            'CZ old Investments product removed':cs.count('onclick="add(\'investice\')"')==0,
            'EN Portfolio name':en.count('<h3>My Portfolio</h3>')==1,
            'EN Portfolio href':en.count('href="/en/my-portfolio.html"')==1,
            'CZ Finance href':cs.count('href="/moje-finance.html"')==1,
            'EN Finance href':en.count('href="/en/my-finances.html"')==1,
            'CZ Health href':cs.count('href="/moje-zdravi.html"')==1,
            'EN Health href':en.count('href="/en/my-health.html"')==1,
          }
          failed=[k for k,v in checks.items() if not v]
          if failed: raise SystemExit('Homepage validation failed: '+', '.join(failed))

          for path,after in expected.items():
            committed=subprocess.check_output(['git','show',f'HEAD:{path.as_posix()}'],text=True)
            if committed!=files[path]: raise SystemExit(f'{path}: working copy differed from HEAD before patch')
            path.write_text(after,encoding='utf-8')
          print('Homepage content validation OK: only targeted product strings were replaced')
          PY
          changed="$(git diff --name-only)"; expected=$'en/index.html\nindex.html'
          test "$changed" = "$expected" || { echo "::error::Unexpected changed files:"; echo "$changed"; exit 1; }
          git diff --check
      - name: Render shared headers
        shell: bash
        run: |
          python3 tools/render-header.py
          python3 tools/render-header.py --check
          changed="$(git diff --name-only)"
          unexpected="$(echo "$changed" | grep -v -E '^(index\.html|en/index\.html|moje-finance\.html|en/my-finances\.html|moje-zdravi\.html|en/my-health\.html|moje-portfolio\.html|en/my-portfolio\.html)$' || true)"
          if [ -n "$unexpected" ]; then echo "::error::Unexpected files changed:"; echo "$unexpected"; exit 1; fi
          git diff --check
      - name: Validate My Portfolio pages, homepage cards and shared cart
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          cs=Path('moje-portfolio.html').read_text(encoding='utf-8'); en=Path('en/my-portfolio.html').read_text(encoding='utf-8')
          home=Path('index.html').read_text(encoding='utf-8'); enhome=Path('en/index.html').read_text(encoding='utf-8'); cart=Path('cart.js').read_text(encoding='utf-8')
          checks={
            'CZ price 500 Kč':'500 Kč' in cs,'EN price CZK 500':'CZK 500' in en,
            'CZ add portfolio':'data-cart-add="portfolio"' in cs,'EN add portfolio':'data-cart-add="portfolio"' in en,
            'CZ cart counter':'data-cart-count' in cs,'EN cart counter':'data-cart-count' in en,
            'CZ checkout':'href="/index.html#checkout"' in cs,'EN checkout':'href="/en/index.html#checkout"' in en,
            'CZ cart.js':'src="/cart.js"' in cs,'EN cart.js':'src="/cart.js"' in en,
            'shared cart portfolio':"'portfolio'" in cart,'shared CZ checkout':"'/index.html#checkout'" in cart,'shared EN checkout':"'/en/index.html#checkout'" in cart,
            'CZ homepage Portfolio':'<h3>Moje portfolio</h3>' in home and 'href="/moje-portfolio.html"' in home and 'onclick="add(\'portfolio\')"' in home,
            'EN homepage Portfolio':'<h3>My Portfolio</h3>' in enhome and 'href="/en/my-portfolio.html"' in enhome,
            'CZ old Investments absent':'<h3>Moje investice</h3>' not in home and 'onclick="add(\'investice\')"' not in home,
            'EN old Investments absent':'<h3>My Investments</h3>' not in enhome,
          }
          failed=[k for k,v in checks.items() if not v]
          if failed: raise SystemExit('Portfolio validation failed: '+', '.join(failed))
          print('Portfolio validation OK: homepage CZ/EN + product pages + shared cart')
          PY
          node --check cart.js
      - name: Check shared navigation
        run: |
          python3 tools/render-header.py --check
          node --check header.js
      - name: Apply SEO metadata to localized pages
        run: python3 tools/apply-seo-head.py
      - name: Audit generated SEO metadata before deployment
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          slugs=['zdravi','finance','investice','cile','vztahy','rozvoj','firma','podnikani','prace']
          names=[f'aplikace-{s}.html' for s in slugs]+['ochrana-osobnich-udaju.html','obchodni-podminky.html','cookies.html']
          errors=[]
          for name in names:
            for lang in ('cs','en'):
              path=Path(name if lang=='cs' else 'en/'+name); text=path.read_text(encoding='utf-8')
              cs=f'https://kupsiapku.cz/{name}'; en=f'https://kupsiapku.cz/en/{name}'; canonical=cs if lang=='cs' else en
              checks=[('robots','name="robots"' in text and 'index,follow' in text),('canonical',f'rel="canonical" href="{canonical}"' in text),('cs hreflang',f'hreflang="cs-CZ" href="{cs}"' in text),('en hreflang',f'hreflang="en" href="{en}"' in text),('x-default',f'hreflang="x-default" href="{cs}"' in text),('title',bool(re.search(r'<title>.+?</title>',text,re.I))),('H1',bool(re.search(r'<h1[^>]*>.*?</h1>',text,re.I|re.S)))]
              for label,ok in checks:
                if not ok: errors.append(f'{path}: {label}')
          if errors: raise SystemExit('SEO audit failed:\n'+'\n'.join(errors))
          print('SEO audit OK: 24 localized pages')
          PY
      - name: Set up PHP for admin security tests
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring
      - name: Validate admin authentication before deployment
        run: |
          php -l api/admin.php
          php -l api/admin-auth.php
          php -l api/bootstrap.php
          node --check admin.js
          python3 tests/admin_auth_test.py
      - name: Validate deployment secrets
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          test -n "$FTP_SERVER"; test -n "$FTP_USERNAME"; test -n "$FTP_PASSWORD"; test -n "$FTP_SERVER_DIR"
      - name: Deploy to Webkitty
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/database/**
            **/.env*
            **/admin-config.php
            **/api/data/*.sqlite*
            **/api/data/admin-database.json
            **/tests/**
            **/docs/**
            **/tools/**
            CNAME
            README.md
      - name: Verify production HTTP, HTTPS, Portfolio and SEO
        shell: bash
        run: |
          sleep 5
          curl --fail --silent --show-error --location --max-time 30 https://kupsiapku.cz/ >/dev/null
          curl --fail --silent --show-error --location --max-time 30 http://kupsiapku.cz/ >/dev/null
          curl --fail --silent --show-error --max-time 30 "https://kupsiapku.cz/moje-portfolio.html?deploy=${GITHUB_SHA}" -o /tmp/portfolio-cs.html
          curl --fail --silent --show-error --max-time 30 "https://kupsiapku.cz/en/my-portfolio.html?deploy=${GITHUB_SHA}" -o /tmp/portfolio-en.html
          curl --fail --silent --show-error --max-time 30 "https://kupsiapku.cz/cart.js?deploy=${GITHUB_SHA}" -o /tmp/cart.js
          grep -F '500 Kč' /tmp/portfolio-cs.html >/dev/null; grep -F 'CZK 500' /tmp/portfolio-en.html >/dev/null
          grep -F 'data-cart-add="portfolio"' /tmp/portfolio-cs.html >/dev/null; grep -F 'data-cart-add="portfolio"' /tmp/portfolio-en.html >/dev/null
          grep -F 'data-cart-count' /tmp/portfolio-cs.html >/dev/null; grep -F 'data-cart-count' /tmp/portfolio-en.html >/dev/null
          grep -F 'href="/index.html#checkout"' /tmp/portfolio-cs.html >/dev/null; grep -F 'href="/en/index.html#checkout"' /tmp/portfolio-en.html >/dev/null
          grep -F "'portfolio'" /tmp/cart.js >/dev/null
          curl --fail --silent --show-error --max-time 30 "https://kupsiapku.cz/?deploy=${GITHUB_SHA}" -o /tmp/home.html
          curl --fail --silent --show-error --max-time 30 "https://kupsiapku.cz/en/?deploy=${GITHUB_SHA}" -o /tmp/en-home.html
          grep -F '<h3>Moje portfolio</h3>' /tmp/home.html >/dev/null
          grep -F 'href="/moje-portfolio.html"' /tmp/home.html >/dev/null
          grep -F 'onclick="add('"'"'portfolio'"'"')"' /tmp/home.html >/dev/null
          ! grep -F '<h3>Moje investice</h3>' /tmp/home.html >/dev/null
          grep -F '<h3>My Portfolio</h3>' /tmp/en-home.html >/dev/null
          grep -F 'href="/en/my-portfolio.html"' /tmp/en-home.html >/dev/null
          ! grep -F '<h3>My Investments</h3>' /tmp/en-home.html >/dev/null
          grep -F 'href="/moje-finance.html"' /tmp/home.html >/dev/null; grep -F 'href="/en/my-finances.html"' /tmp/en-home.html >/dev/null
          grep -F 'href="/moje-zdravi.html"' /tmp/home.html >/dev/null; grep -F 'href="/en/my-health.html"' /tmp/en-home.html >/dev/null
          curl --fail --silent --show-error --max-time 30 "https://kupsiapku.cz/api/index.php" | grep -q '"ok":true'
          echo 'Production verification OK: homepage Portfolio CZ/EN + shared cart + checkout targets'
