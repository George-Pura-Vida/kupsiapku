name: Deploy kupsiapku.cz
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: kupsiapku-production
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment secrets
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          test -n "$FTP_SERVER" || { echo "Missing FTP_SERVER"; exit 1; }
          test -n "$FTP_USERNAME" || { echo "Missing FTP_USERNAME"; exit 1; }
          test -n "$FTP_PASSWORD" || { echo "Missing FTP_PASSWORD"; exit 1; }
          test -n "$FTP_SERVER_DIR" || { echo "Missing FTP_SERVER_DIR"; exit 1; }
      - name: Deploy to Webkitty
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/database/**
            **/.env*
            CNAME
            README.md
      - name: Verify production HTTP and HTTPS
        shell: bash
        run: |
          sleep 5
          curl --fail --silent --show-error --location --max-time 30 https://kupsiapku.cz/ > /dev/null
          curl --fail --silent --show-error --location --max-time 30 http://kupsiapku.cz/ > /dev/null
          for path in "/404.html" "/this-page-should-not-exist-${GITHUB_SHA}" "/missing-${GITHUB_SHA}/nested/page"; do
            expected=404
            [[ "$path" == "/404.html" ]] && expected=200
            verified=false
            for attempt in {1..6}; do
              status=$(curl --silent --show-error --max-time 30 --output /tmp/error-page.html --write-out '%{http_code}' "https://kupsiapku.cz${path}?deploy=${GITHUB_SHA}") || status=000
              if [[ "$status" == "$expected" ]] &&
                 grep -q 'id="error-title"' /tmp/error-page.html &&
                 grep -q 'name="robots" content="noindex,follow"' /tmp/error-page.html; then
                verified=true
                break
              fi
              sleep 10
            done
            [[ "$verified" == true ]] || { echo "Failed: $path expected $expected, got $status or wrong page content"; exit 1; }
            echo "Verified $path: HTTP $status and custom error page"
          done
          curl --fail --silent --show-error --max-time 30 "https://kupsiapku.cz/?deploy=${GITHUB_SHA}" --output /tmp/home-page.html
          grep -q 'name="keywords"' /tmp/home-page.html
          curl --fail --silent --show-error --max-time 30 "https://kupsiapku.cz/doporucit.html?deploy=${GITHUB_SHA}" | grep -q 'affiliate.js?v=20260925-5'
          curl --fail --silent --show-error --max-time 30 "https://kupsiapku.cz/affiliate.js?v=${GITHUB_SHA}" --output /tmp/affiliate.js
          grep -q 'qrData(profile.shareUrl)' /tmp/affiliate.js
          if grep -q 'qrUrl(profile.shareUrl)' /tmp/affiliate.js; then echo "Stale QR function found"; exit 1; fi
          curl --fail --silent --show-error --max-time 30 "https://kupsiapku.cz/prispet.html?deploy=${GITHUB_SHA}" | grep -q 'id="donationForm"'
          curl --fail --silent --show-error --max-time 30 "https://kupsiapku.cz/api/index.php" | grep -q '"ok":true'
          echo "Production verification OK"
