name: Deploy kupsiapku.cz
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: kupsiapku-production
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment secrets
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          test -n "$FTP_SERVER" || { echo "Missing FTP_SERVER"; exit 1; }
          test -n "$FTP_USERNAME" || { echo "Missing FTP_USERNAME"; exit 1; }
          test -n "$FTP_PASSWORD" || { echo "Missing FTP_PASSWORD"; exit 1; }
          test -n "$FTP_SERVER_DIR" || { echo "Missing FTP_SERVER_DIR"; exit 1; }
      - name: Deploy to Webkitty
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/database/**
            **/.env*
            CNAME
            README.md
      - name: Verify production HTTP and HTTPS
        shell: bash
        run: |
          sleep 5
          curl --fail --silent --show-error --location --max-time 30 https://kupsiapku.cz/ > /dev/null
          curl --fail --silent --show-error --location --max-time 30 http://kupsiapku.cz/ > /dev/null
          echo "Production verification OK"
